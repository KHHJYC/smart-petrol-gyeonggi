name: Check official API connectivity
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, windows-latest, macos-latest]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check small official requests without exposing credentials
        env:
          GG_API_KEY: ${{ secrets.GG_API_KEY }}
        run: python -u scripts/probe_apis.py --sizes 25 100 250
